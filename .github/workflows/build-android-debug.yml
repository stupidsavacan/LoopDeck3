name: Build Android Debug APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopdeck-android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web dependencies
        run: npm ci --include=dev

      - name: Test web app
        run: npm test

      - name: Build web assets
        run: npm run build:single

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug-signed APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: List debug APK outputs
        if: always()
        run: |
          echo "APK outputs:"
          find android/app/build/outputs -type f -name "*.apk" -print || true
          echo "Output tree:"
          find android/app/build/outputs -maxdepth 6 -type f -print || true

      - name: Collect debug APK artifacts
        run: |
          set -euo pipefail
          rm -rf artifacts/debug-apk
          mkdir -p artifacts/debug-apk
          find android/app/build/outputs -type f -name "*.apk" -exec cp {} artifacts/debug-apk/ \;
          echo "Collected APK artifacts:"
          find artifacts/debug-apk -type f -name "*.apk" -print
          apk_count="$(find artifacts/debug-apk -type f -name "*.apk" | wc -l | tr -d ' ')"
          if [ "$apk_count" -eq 0 ]; then
            echo "::error::No debug APKs were collected from android/app/build/outputs."
            exit 1
          fi

      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: LoopDeck3-debug-apk
          path: artifacts/debug-apk/*.apk
          if-no-files-found: error
          retention-days: 7

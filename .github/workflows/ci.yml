name: LoopDeck3 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopdeck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"

jobs:
  web-check:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web dependencies
        run: npm ci --include=dev

      - name: Verify lockfile registry hosts
        run: |
          node -e "const lock=require('./package-lock.json'); const bad=Object.entries(lock.packages||{}).flatMap(([name,p])=>p&&p.resolved&&!p.resolved.startsWith('https://registry.npmjs.org/')?[[name,p.resolved]]:[]); if(bad.length){console.error('Unexpected registry entries:',bad); process.exit(1)}"

      - name: Show installed tool versions
        run: |
          node --version
          npm --version
          npx vite --version
          npx vitest --version

      - name: Check TypeScript architecture
        run: npm run check:architecture
      - name: Run dead-code audit
        run: npm run deadcode

      - name: Run lint guardrails
        run: npm run lint

      - name: Generate source navigation index
        run: npm run code:map

      - name: Run web tests
        run: npm test

      - name: Build LoopDeck web assets
        run: npm run build

      - name: Build single-file LoopDeck HTML
        run: npm run build:single

      - name: Verify single-file HTML
        run: |
          set -euo pipefail
          test -s LoopDeck3.html
          echo "Single HTML size: $(wc -c < LoopDeck3.html) bytes"

      - name: Upload single-file HTML
        uses: actions/upload-artifact@v7
        with:
          name: LoopDeck3-html
          path: LoopDeck3.html
          if-no-files-found: error
          retention-days: 7

  single-file-chrome-qa:
    name: Single-file Chrome QA
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web dependencies
        run: npm ci --include=dev

      - name: Show Chrome version
        shell: powershell
        run: |
          $chrome = (Get-Item "C:\Program Files\Google\Chrome\Application\chrome.exe" -ErrorAction Stop).VersionInfo.ProductVersion
          Write-Host "Google Chrome $chrome"

      - name: Run single-file Chrome QA
        run: npm run qa:chrome

      - name: Upload Chrome QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: single-file-chrome-qa
          path: |
            qa-report/
            qa-results/
            LoopDeck3.html
          if-no-files-found: warn
          retention-days: 7

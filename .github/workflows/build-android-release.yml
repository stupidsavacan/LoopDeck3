name: Release HTML and APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loopdeck3-release-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci --include=dev
      - name: Derive traceable Android version
        run: node scripts/android-version.mjs

      # Full unit/browser QA runs in ci.yml. Release only rebuilds and
      # validates the exact artifacts that will be published.
      - name: Build release single HTML
        run: npm run build:single
      - name: Smoke-check release HTML
        run: |
          set -euo pipefail
          test -s LoopDeck3.html
          grep -qi '<!doctype html>' LoopDeck3.html
          grep -q 'id="app"' LoopDeck3.html
          echo "Release HTML size: $(wc -c < LoopDeck3.html) bytes"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Prepare stable release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('All four Android signing secrets must be configured.')
          Path('android/loopdeck-release.jks').write_bytes(base64.b64decode(os.environ[names[0]], validate=True))
          values = [('storeFile', str(Path('android/loopdeck-release.jks').resolve())), ('storePassword', os.environ['KEYSTORE_PASSWORD']), ('keyAlias', os.environ['KEY_ALIAS']), ('keyPassword', os.environ['KEY_PASSWORD'])]
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
          Path('android/keystore.properties').write_text(''.join(k + '=' + escape(v) + '\n' for k, v in values), encoding='utf-8')
          PY
      - name: Package the release HTML in WebView
        working-directory: android
        run: gradle --no-daemon assembleRelease -PappVersionName="$LOOPDECK_VERSION_NAME" -PappVersionCode="$LOOPDECK_VERSION_CODE"
      - name: Verify signature and identical HTML payload
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk LoopDeck3.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose LoopDeck3.apk
          unzip -p LoopDeck3.apk assets/loopdeck/index.html > packaged.html
          cmp LoopDeck3.html packaged.html
          sha256sum LoopDeck3.apk LoopDeck3.html > SHA256SUMS.txt
      - name: Publish both downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="signed-apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          release_title="LoopDeck3 build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          apk_asset_name="LoopDeck3-signed-release-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          html_asset_name="LoopDeck3-single-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.html"
          cp LoopDeck3.apk "$apk_asset_name"
          cp LoopDeck3.html "$html_asset_name"
          sha256sum "$apk_asset_name" "$html_asset_name" > SHA256SUMS.txt
          gh release create "$release_tag" "$apk_asset_name" "$html_asset_name" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$release_title" --notes "Signed APK and single-file HTML built from ${GITHUB_SHA}. APK embeds the exact HTML attached to this release. Independent Android app ID: com.loopdeck3.app." --draft
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-evidence
          path: SHA256SUMS.txt
          if-no-files-found: warn
      - name: Remove temporary signing files
        if: always()
        run: rm -f android/loopdeck-release.jks android/keystore.properties

name: Release HTML and APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loopdeck3-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci --include=dev
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          test "$minor" -lt 1000 && test "$patch" -lt 1000
          code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          test "$code" -gt 0 && test "$code" -le 2100000000
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm run verify
      - run: npm run build:single
      - run: npx playwright install --with-deps chromium
      - name: Exercise the exact release HTML
        env:
          QA_BROWSER: chromium
        run: npx playwright test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Prepare stable release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('All four Android signing secrets must be configured.')
          Path('android/loopdeck-release.jks').write_bytes(base64.b64decode(os.environ[names[0]], validate=True))
          values = [('storeFile', str(Path('android/loopdeck-release.jks').resolve())), ('storePassword', os.environ['KEYSTORE_PASSWORD']), ('keyAlias', os.environ['KEY_ALIAS']), ('keyPassword', os.environ['KEY_PASSWORD'])]
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
          Path('android/keystore.properties').write_text(''.join(k + '=' + escape(v) + '\n' for k, v in values), encoding='utf-8')
          PY
      - name: Package the release HTML in WebView
        working-directory: android
        run: gradle --no-daemon assembleRelease -PappVersionName=${{ steps.version.outputs.name }} -PappVersionCode=${{ steps.version.outputs.code }}
      - name: Verify signature and identical HTML payload
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk LoopDeck3.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose LoopDeck3.apk
          unzip -p LoopDeck3.apk assets/loopdeck/index.html > packaged.html
          cmp LoopDeck3.html packaged.html
          sha256sum LoopDeck3.apk LoopDeck3.html > SHA256SUMS.txt
      - name: Publish both downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create '${{ steps.version.outputs.tag }}' LoopDeck3.apk LoopDeck3.html SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'LoopDeck3 ${{ steps.version.outputs.name }}' --notes "Offline HTML application with a WebView host. APK embeds the exact HTML attached to this release. No old user-data or internal API compatibility is provided. Source: $GITHUB_SHA. Independent Android app ID: com.loopdeck3.app." --draft
          gh release edit '${{ steps.version.outputs.tag }}' --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-evidence
          path: |
            qa-results/
            qa-report/
            SHA256SUMS.txt
          if-no-files-found: warn
      - name: Remove temporary signing files
        if: always()
        run: rm -f android/loopdeck-release.jks android/keystore.properties
